[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-vision-quantization-lab"
version = "0.1.0"
description = "SAM 2.1 quantization and Apple Silicon edge inference benchmarking lab."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.26",
    "psutil>=5.9",
    "coremltools>=9.0",
    "Pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
